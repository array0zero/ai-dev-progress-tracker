name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.2

      - name: Verify npm minimum version
        run: |
          npm_version="$(npm --version)"
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); const ok=a>12||(a===12&&(b>0||(b===0&&c>=2))); process.exit(ok?0:1)" "$npm_version"

      - name: Verify Node minimum version
        run: |
          node -e "const [a,b,c]=process.versions.node.split('.').map(Number); const ok=a>24||(a===24&&(b>15||(b===15&&c>=0))); process.exit(ok?0:1)"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: E2E tests
        run: npm run test:e2e

      - name: Secret scan
        run: npm run verify:secrets
